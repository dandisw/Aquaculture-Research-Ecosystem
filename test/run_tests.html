<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AREs Automated Test Suite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=MuseoModerno:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', 'DM Sans', system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 2rem; max-width: 800px; margin: 0 auto; }
        h1 { font-family: 'MuseoModerno', 'Syne', sans-serif; border-bottom: 1px solid #334155; padding-bottom: 0.5rem; }
        .test-module { background-color: #1e293b; border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .test-module h2 { font-family: 'Syne', sans-serif; margin-top: 0; color: #38bdf8; font-size: 1.25rem; }
        .pass { font-family: 'DM Mono', monospace; color: #4ade80; font-weight: bold; margin: 0.5rem 0; }
        .fail { font-family: 'DM Mono', monospace; color: #f87171; font-weight: bold; margin: 0.5rem 0; }
        .summary { font-family: 'DM Mono', monospace; margin-top: 2rem; padding: 1rem; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; font-size: 1.1rem;}
    </style>
</head>
<body>
    <h1>AREs Core Algorithms Test</h1>
    <p>Automated client-side testing for AquaLab, StatWise, BioTools, and EcoMetrics.</p>
    
    <div id="test-results"></div>
    <div id="test-summary" class="summary"></div>

    <script src="../js/aqualab.js"></script>
    <script src="../js/statwise.js"></script>
    <script src="../js/biotools.js"></script>
    <script src="../js/mol3d.js"></script>
    <script src="../js/ecometrics.js"></script>
    <script src="../js/storage-sync.js"></script>

    <script src="tests.js"></script>
</body>
</html>
