<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AREs Automated Test Suite</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 2rem; max-width: 800px; margin: 0 auto; }
        h1 { border-bottom: 1px solid #334155; padding-bottom: 0.5rem; }
        .test-module { background-color: #1e293b; border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .test-module h2 { margin-top: 0; color: #38bdf8; font-size: 1.25rem; }
        .pass { color: #4ade80; font-weight: bold; margin: 0.5rem 0; }
        .fail { color: #f87171; font-weight: bold; margin: 0.5rem 0; }
        .summary { margin-top: 2rem; padding: 1rem; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; font-size: 1.1rem;}
    </style>
</head>
<body>
    <h1>AREs Core Algorithms Test</h1>
    <p>Automated client-side testing for AquaLab, StatWise, BioTools, and EcoMetrics.</p>
    
    <div id="test-results"></div>
    <div id="test-summary" class="summary"></div>

    <script src="../js/aqualab.js"></script>
    <script src="../js/statwise.js"></script>
    <script src="../js/biotools.js"></script>
    <script src="../js/ecometrics.js"></script>

    <script src="test.js"></script>
</body>
</html>
